---

- name: Web Environment
  hosts: webservers
  vars:
  gather_facts: True
  become: True
  tasks:
  
  - name: Install apache2 on the web server
    apt:
      name: apache2
      state: present

  - name: Create directories for environment
    file:
      path: "/var/www/html_{{ env}}"
      state: directory
    loop:
      - dev
      - qa
      - test
    notify:
      - Restart apache2

  - name: Add the Listener ports to /etc/apache2/ports.conf
    lineinfile:
      path: /etc/apache2/ports.conf
      state: present
      line: "Listen {{ item.port }}"
      insertafter: "^Listen"
    loop:
      - port: 8080
        env: dev
      - port: 8081
        env: test
      - port: 8082
        env: qa
    notify:
      - Restart apache2

  - name: Push the Virtual Directives files into the correct place
    copy:
      src: "{{ item.src }}"
      dest: "/etc/apache2/sites-available/{{ item.dest }}"
    loop:
      - src: dev_virtual_host.conf
        dest: dev_virtual_host.conf
      - src: test_virtual_host.conf
        dest: test_virtual_host.conf
      - src: qa_virtual_host.conf
        dest: qa_virtual_host.conf
    notify:
      - Restart apache2
    
  - name: Push the html for each page over
    copy:
      src: "{{ item.name }}"
      dest: "/var/www/html_{{ item.env }}/index.html"
    loop:
      - name: dev_index.html
        env: dev
      - name: test_index.html
        env: test
      - name: qa_index.html
        env: qa
    notify:
      - Restart apache
    
  handlers:
  - name: Restart apache
    systemd:
      state: restarted
      name: apache2