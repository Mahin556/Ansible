---
- name: Step 1 - Gather facts and create dynamic groups
  hosts: all
  gather_facts: true
  tasks:
    - name: Create groups based on OS family
      ansible.builtin.group_by:
        key: "os_{{ ansible_os_family | lower }}"

- name: Step 2 - Target the dynamically created Debian group
  hosts: os_debian
  tasks:
    - name: Run Debian specific task
      ansible.builtin.apt:
        name: curl
        state: present

- name: Step 3 - Target the dynamically created RedHat group
  hosts: os_redhat
  tasks:
    - name: Run RedHat specific task
      ansible.builtin.dnf:
        name: curl
        state: present
